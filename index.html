<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2310b981' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z'/><path d='m9 12 2 2 4-4'/></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>TrustLink — Social Commerce Escrow & Anti-Fraud Protection</title>
    <meta name="description" content="Mobile-first social commerce escrow checkout & live tracking with physical weight audits and 48-hour buyer inspection protection." />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  </head>
  <body class="bg-slate-50 text-slate-900 dark:bg-zinc-950 dark:text-zinc-100 antialiased selection:bg-emerald-500/20 selection:text-emerald-400">
    <div id="root"></div>

    <!-- Friendly instruction if opened as local file:/// instead of http://localhost -->
    <script>
      if (window.location.protocol === 'file:') {
        window.addEventListener('DOMContentLoaded', () => {
          setTimeout(() => {
            const root = document.getElementById('root');
            if (root && (!root.children || root.children.length === 0)) {
              root.innerHTML = `
                <div style="font-family: system-ui, -apple-system, sans-serif; min-height: 100vh; background: #09090b; color: #f4f4f5; display: flex; align-items: center; justify-content: center; padding: 24px;">
                  <div style="max-width: 480px; width: 100%; background: #18181b; border: 1px solid rgba(16, 185, 129, 0.4); border-radius: 24px; padding: 32px; box-shadow: 0 24px 48px rgba(0,0,0,0.6); text-align: center;">
                    <div style="width: 56px; height: 56px; background: rgba(16, 185, 129, 0.15); border: 1px solid rgba(16, 185, 129, 0.3); border-radius: 18px; display: inline-flex; align-items: center; justify-content: center; color: #10b981; font-size: 28px; margin-bottom: 20px;">🛡️</div>
                    <h2 style="font-size: 22px; font-weight: 800; margin-bottom: 8px; color: #ffffff; letter-spacing: -0.02em;">TrustLink Escrow Dev Server</h2>
                    <p style="font-size: 13px; color: #a1a1aa; line-height: 1.6; margin-bottom: 24px;">
                      You opened this file directly from disk via <code>file://</code>. Modern React + Vite applications run through a local web server to execute modular components and TypeScript.
                    </p>
                    <div style="background: #09090b; border: 1px solid #27272a; border-radius: 16px; padding: 18px; margin-bottom: 24px; text-align: left;">
                      <div style="font-size: 11px; color: #71717a; text-transform: uppercase; font-weight: 700; margin-bottom: 8px; letter-spacing: 0.05em;">Open in your browser:</div>
                      <a href="http://localhost:5173" style="display: block; font-size: 16px; font-family: monospace; font-weight: 700; color: #34d399; text-decoration: none; padding: 10px 14px; background: rgba(16, 185, 129, 0.1); border-radius: 10px; border: 1px solid rgba(16, 185, 129, 0.25);">
                        👉 http://localhost:5173
                      </a>
                    </div>
                    <p style="font-size: 12px; color: #71717a; margin-top: 12px;">
                      If Vite is not running yet, execute <code style="color: #34d399; background: #27272a; padding: 2px 6px; rounded: 4px;">npm run dev</code> in the terminal.
                    </p>
                  </div>
                </div>
              `;
            }
          }, 300);
        });
      }
    </script>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
